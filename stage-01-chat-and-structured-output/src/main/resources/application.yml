# 默认配置：接入 OpenAI-compatible 云端端点。
# 会自动尝试加载项目根目录或当前目录的 .env（见 .env.example），也可直接通过环境变量提供，密钥不会写进代码仓库。
spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# 调试阶段默认开启阶段一包下的 DEBUG 日志（含 SSE 分片序号与字符数统计），可通过环境变量 STAGE01_LOG_LEVEL 调整。
logging:
  level:
    dev.javaagentstudy.stage01: ${STAGE01_LOG_LEVEL:DEBUG}
