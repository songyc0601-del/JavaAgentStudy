# 测试专用配置（只在运行测试时生效）。
# 自动装配会在启动时创建 OpenAI 相关 Bean，它们要求必须有 API Key，否则上下文启动失败。
# 这里给一个占位值只是为了让 Bean 能创建出来；测试里最外层的 ChatModel 已被假模型替换，不会真的访问网络。
spring.ai.openai.api-key=test-placeholder-key

# 降低测试控制台的框架噪音（同时保留 dev.javaagentstudy.stage01 的 DEBUG 日志以支撑分支日志测试）。
spring.main.banner-mode=off
logging.level.org.springframework=WARN
logging.level.org.springdoc=WARN
logging.level.org.hibernate.validator=WARN
